<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>55 Club — Premium Navigator</title>
<meta name="description" content="Get the 55 Club premium navigator for free. Limited time direct download or Telegram access. Safe and verified." />

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --red: #dc2626;
    --red-light: #f87171;
    --red-dark: #991b1b;
    --white: #ffffff;
    --text-dark: #14141a;
    --text-muted: #7a7a85;
    --tg-blue: #229ED9;
    --tg-blue-dark: #1a7fb0;
    --green: #0b8a3e;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background:
      radial-gradient(circle at 15% 10%, rgba(220, 38, 38, 0.50) 0%, transparent 42%),
      radial-gradient(circle at 88% 90%, rgba(34, 158, 217, 0.25) 0%, transparent 48%),
      radial-gradient(circle at 80% 15%, rgba(248, 113, 113, 0.25) 0%, transparent 40%),
      linear-gradient(150deg, #0d0405 0%, #1f0a0c 45%, #080202 100%);
    position: relative;
    overflow: hidden; /* no scroll */
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    mask-image: radial-gradient(circle at center, black 5%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 5%, transparent 80%);
  }

  .glow {
    position: fixed;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220, 38, 38, 0.35) 0%, transparent 68%);
    filter: blur(80px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.85; transform: translate(-50%, -50%) scale(1.15); }
  }

  /* ================= CARD ================= */
  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    background: var(--white);
    border-radius: 26px;
    padding: 30px 24px 0;
    text-align: center;
    box-shadow:
      0 0 0 1px rgba(220, 38, 38, 0.15),
      0 35px 80px -20px rgba(0, 0, 0, 0.8),
      0 0 100px -25px rgba(220, 38, 38, 0.6);
    overflow: hidden;
    animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    z-index: 2;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--red-dark), var(--red), var(--red-light), var(--red), var(--red-dark));
    background-size: 220% 100%;
    animation: slide 3.5s linear infinite;
  }
  @keyframes slide { to { background-position: -220% 0; } }

  /* ================= LOGO ================= */
  .logo {
    width: 76px;
    height: 76px;
    margin: 0 auto 14px;
    border-radius: 22px;
    background: linear-gradient(150deg, var(--red-light), var(--red) 45%, var(--red-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow:
      0 14px 34px -10px rgba(220, 38, 38, 0.8),
      inset 0 2px 0 rgba(255, 255, 255, 0.35),
      inset 0 -3px 10px rgba(0, 0, 0, 0.25);
    animation: floaty 4s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .logo::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 29px;
    border: 2px solid rgba(220, 38, 38, 0.20);
    animation: ringPulse 2.8s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.06); opacity: 0.3; }
  }

  .logo .num {
    font-size: 28px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: -2px;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  .logo .club {
    position: absolute;
    bottom: 11px;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.92);
    text-transform: uppercase;
  }

  /* ================= BADGE ================= */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #fff0f2, #ffe3e7);
    color: var(--red);
    border: 1px solid rgba(220, 38, 38, 0.25);
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 100px;
    margin-bottom: 14px;
  }

  .badge i { font-size: 9px; color: var(--red); animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ================= HEADING ================= */
  h1 {
    font-size: 21px;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.25;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  h1 em { font-style: normal; color: var(--red); }

  .sub {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.5;
    max-width: 290px;
    margin: 0 auto 16px;
  }

  /* ================= COMPACT FILE INFO ================= */
  .file-info-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(145deg, #fff8f9, #fdeef1);
    border: 1.5px solid rgba(220, 38, 38, 0.18);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }

  .file-info-box .fi-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(145deg, var(--red-light), var(--red) 55%, var(--red-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 6px 14px -5px rgba(220, 38, 38, 0.7);
  }

  .file-info-box .fi-text {
    text-align: left;
    flex: 1;
    min-width: 0;
  }

  .file-info-box .fi-name {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.2px;
  }

  .file-info-box .fi-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .file-info-box .fi-meta .apk-tag {
    font-size: 7.5px;
    font-weight: 900;
    letter-spacing: 0.7px;
    color: var(--green);
    background: #d7f5e2;
    border: 1px solid #a8e6c0;
    padding: 1px 6px;
    border-radius: 100px;
    text-transform: uppercase;
  }

  /* ================= BUTTONS ================= */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--white);
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.25s ease, background-position 0.5s ease;
  }

  .btn i { font-size: 17px; }

  .btn::after {
    content: "";
    position: absolute;
    top: 0; left: -110%;
    width: 55%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    transition: left 0.65s ease;
  }

  .btn:hover::after { left: 135%; }
  .btn:active { transform: translateY(0) scale(0.985); }

  .btn-primary {
    background: linear-gradient(135deg, var(--red-light) 0%, var(--red) 50%, var(--red-dark) 100%);
    background-size: 200% 200%;
    box-shadow:
      0 14px 30px -10px rgba(220, 38, 38, 0.85),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -2px 8px rgba(0, 0, 0, 0.2);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    background-position: 100% 50%;
    box-shadow:
      0 22px 40px -12px rgba(220, 38, 38, 1),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .btn-telegram {
    background: linear-gradient(135deg, #2bb0e8 0%, var(--tg-blue) 50%, var(--tg-blue-dark) 100%);
    background-size: 200% 200%;
    box-shadow:
      0 14px 30px -10px rgba(34, 158, 217, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -2px 8px rgba(0, 0, 0, 0.18);
  }

  .btn-telegram:hover {
    transform: translateY(-2px);
    background-position: 100% 50%;
    box-shadow:
      0 22px 40px -12px rgba(34, 158, 217, 1),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  /* ================= TRUST ================= */
  .trust {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.2px;
  }

  .trust i { color: var(--red); font-size: 11px; }

  /* ================= FOOTER STRIP ================= */
  .card-footer {
    margin-top: 18px;
    margin-left: -24px;
    margin-right: -24px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #fdf7f8, #fbeeef);
    border-top: 1px solid rgba(220, 38, 38, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .card-footer .item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #a8a8b4;
  }

  .card-footer .item i { font-size: 11px; color: var(--red); opacity: 0.85; }

  .card-footer .sep {
    width: 1px; height: 12px;
    background: rgba(220, 38, 38, 0.18);
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 380px) {
    .card { padding: 26px 18px 0; border-radius: 22px; }
    .card-footer { margin-left: -18px; margin-right: -18px; padding: 11px 12px; gap: 9px; }
    .logo { width: 68px; height: 68px; }
    .logo .num { font-size: 25px; }
    h1 { font-size: 19px; }
    .sub { font-size: 12px; margin-bottom: 14px; }
    .btn { font-size: 12px; padding: 14px; letter-spacing: 0.8px; }
    .btn i { font-size: 15px; }
    .card-footer .item { font-size: 7.5px; }
    .card-footer .item i { font-size: 10px; }
  }

  /* ---- Short landscape phones ---- */
  @media (max-height: 560px) and (orientation: landscape) {
    body { align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
    .card { padding: 22px 22px 0; }
    .logo { width: 60px; height: 60px; margin-bottom: 10px; }
    .logo .num { font-size: 22px; }
    h1 { font-size: 18px; }
    .sub { margin-bottom: 12px; font-size: 11.5px; }
    .file-info-box { padding: 8px 12px; margin-bottom: 12px; }
    .btn { padding: 13px; font-size: 11.5px; }
    .trust { margin-top: 10px; }
    .card-footer { margin-top: 14px; padding: 10px 12px; }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
